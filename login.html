<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Signal — Log in</title>
  <style>
    @font-face {
      font-family: 'FreeSans';
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url('/fonts/FreeSans.woff2') format('woff2');
    }
    @font-face {
      font-family: 'FreeSans';
      font-style: normal;
      font-weight: 700;
      font-display: block;
      src: url('/fonts/FreeSansBold.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Eloquia';
      font-style: normal;
      font-weight: 200 800;
      font-display: block;
      src: url('/fonts/Eloquia.woff2') format('woff2-variations');
    }
    :root {
  --ink: #000;
  --h1-color: #2c3343;
  --sub-grey: #64748b;
  --ph: #606060;
  --or: #5a5a5b;
  --gtext: #232424;
  --bottom: #0a0a0a;
  --btn1: #283139;
  --btn2: #293340;
  --inputFill: #fafafa;
  --inputBorder: #acacae;
  --pwFill: #f9f9f9;
  --gBorder: #c8c8ca;
  --divider: #b1b1b2;
  --page: #fefefe;
}

.login-stage {
  min-height: 100vh;
  min-height: 100svh;
  width: 100%;
  position: relative;
  overflow-x: hidden;
  background: #090d14;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  font-family: "FreeSans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
}

/* Pre-paint guard */
.entry-pending .back-btn,
.entry-pending .login-card,
.entry-pending #hl1,
.entry-pending #hl2,
.entry-pending #h1,
.entry-pending #sub,
.entry-pending #email,
.entry-pending #pw,
.entry-pending #loginBtn,
.entry-pending .login-divider,
.entry-pending #gBtn,
.entry-pending #bottom {
  opacity: 0;
  will-change: transform, opacity;
}

.entry-pending .back-btn {
  transform: translateX(-8px);
}
.entry-pending #hl1,
.entry-pending #hl2 {
  transform: translateY(12px);
}
.entry-pending .login-card {
  transform: translateY(16px);
}
.entry-pending #h1,
.entry-pending #sub,
.entry-pending #email,
.entry-pending #pw,
.entry-pending #loginBtn,
.entry-pending #gBtn {
  transform: translateY(8px);
}
.entry-pending .login-divider,
.entry-pending #bottom {
  transform: translateY(6px);
}

@media (prefers-reduced-motion: reduce) {
  .login-stage * {
    transition: none !important;
    animation: none !important;
  }
  .entry-pending .back-btn,
  .entry-pending .login-card,
  .entry-pending #hl1,
  .entry-pending #hl2,
  .entry-pending #h1,
  .entry-pending #sub,
  .entry-pending #email,
  .entry-pending #pw,
  .entry-pending #loginBtn,
  .entry-pending .login-divider,
  .entry-pending #gBtn,
  .entry-pending #bottom {
    opacity: 1 !important;
    transform: none !important;
    will-change: auto !important;
  }
}

/* 1) Fixed Full-screen Video Background */
.photo {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100svh;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.photo-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 35% center;
  display: block;
  -webkit-user-drag: none;
}

.scrim {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(90deg, rgba(8, 12, 18, 0.65) 0%, rgba(8, 12, 18, 0.25) 45%, rgba(8, 12, 18, 0.40) 100%),
              linear-gradient(180deg, rgba(8, 12, 18, 0.45) 0%, transparent 40%, rgba(8, 12, 18, 0.70) 100%);
}

/* 2) Back Button */
.back-btn {
  position: fixed;
  top: 28px;
  left: 32px;
  z-index: 40;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px 10px 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.28);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
  color: #ffffff;
  font-family: "FreeSans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

.back-btn:hover {
  background: rgba(255, 255, 255, 0.28);
  border-color: rgba(255, 255, 255, 0.45);
  transform: translateX(-3px);
  color: #ffffff;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
}

.back-btn:active {
  transform: translateX(-1px) scale(0.98);
}

.back-icon {
  width: 16px;
  height: 16px;
  display: block;
  flex-shrink: 0;
}

/* 3) Desktop Layout (>= 900px) - Form Login Setengah Halaman */
@media (min-width: 900px) {
  .login-stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  .login-container {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
  }

  /* Left Half: 50% Video Canvas with Headline */
  .hero {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 52%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 48px clamp(32px, 5vw, 64px) clamp(48px, 8vh, 84px);
    box-sizing: border-box;
    z-index: 10;
    pointer-events: none;
  }

  .hl-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 560px;
  }

  .hl {
    display: block;
    font-family: "Eloquia", sans-serif;
    font-variation-settings: "wght" 580;
    line-height: 1.05;
    color: #ffffff;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8), 0 1px 4px rgba(0, 0, 0, 0.5);
    white-space: normal;
    word-break: break-word;
  }

  #hl1 {
    font-size: clamp(38px, 4.2vw, 62px);
    letter-spacing: -0.03em;
  }

  #hl2 {
    font-size: clamp(38px, 4.2vw, 62px);
    letter-spacing: -0.03em;
  }

  /* Right Half: Form Login Setengah Halaman (Full Height 48% Width) */
  .pane {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 48%;
    z-index: 20;
    padding: 14px 14px 14px 0;
    box-sizing: border-box;
    display: flex;
  }

  .login-card {
    width: 100%;
    height: 100%;
    border-radius: 26px;
    background: rgba(254, 254, 254, 0.94);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.75);
    box-shadow: 1px 10px 28px rgba(10, 14, 20, 0.22), 0 1px 4px rgba(10, 14, 20, 0.08);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: clamp(28px, 4vh, 48px) clamp(32px, 4.5vw, 64px);
    box-sizing: border-box;
    overflow-y: auto;
  }

  .card-in {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
}

/* Card Content Styles (Common to all viewports) */
.card-h1 {
  font-family: "Eloquia", sans-serif;
  font-variation-settings: "wght" 584;
  font-size: clamp(32px, 3vw, 40px);
  letter-spacing: -0.04em;
  color: var(--h1-color);
  line-height: 1.1;
  text-align: center;
  margin: 0 0 6px 0;
}

.card-sub {
  font-size: clamp(15px, 1.4vw, 17px);
  letter-spacing: -0.015em;
  color: var(--sub-grey);
  line-height: 1.4;
  text-align: center;
  margin: 0 0 clamp(18px, 2.5vh, 26px) 0;
}

.card-sub b {
  font-weight: 700;
  color: var(--ink);
}

.field {
  width: 100%;
  height: clamp(52px, 6vh, 60px);
  display: flex;
  align-items: center;
  border-radius: 12px;
  margin-bottom: clamp(10px, 1.4vh, 14px);
  box-sizing: border-box;
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
}

.field input {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-family: "FreeSans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  font-size: 16px;
  padding: 0 18px;
  box-sizing: border-box;
}

.field input::placeholder {
  color: var(--ph);
  opacity: 1;
}

#email {
  background: var(--inputFill);
  border: 1.5px solid var(--inputBorder);
}

#email:focus-within {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

#pw {
  background: var(--pwFill);
  border: 1.5px solid var(--inputBorder);
  margin-bottom: clamp(16px, 2.2vh, 22px);
}

#pw:focus-within {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

#loginBtn {
  width: 100%;
  height: clamp(54px, 6.5vh, 62px);
  border-radius: 12px;
  border: none;
  background: linear-gradient(180deg, var(--btn1), var(--btn2));
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 16.5px;
  font-weight: 500;
  margin-bottom: clamp(14px, 2vh, 20px);
  box-shadow: 0 4px 14px rgba(40, 49, 57, 0.28);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
}

#loginBtn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(40, 49, 57, 0.36);
}

#loginBtn:active {
  transform: translateY(0);
}

.login-arrow {
  width: 14px;
  height: 14px;
  display: block;
}

.login-divider {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: clamp(14px, 2vh, 20px);
}

.login-divider i {
  height: 1px;
  background: var(--divider);
  flex: 1 1 auto;
  display: block;
}

.login-divider b {
  color: var(--or);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

#gBtn {
  width: 100%;
  height: clamp(52px, 6vh, 60px);
  border-radius: 12px;
  border: 1px solid var(--gBorder);
  background: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: clamp(18px, 2.5vh, 26px);
  transition: background-color 0.16s ease, border-color 0.16s ease;
}

#gBtn:hover {
  background-color: #fbfbfb;
  border-color: #b5b5b8;
}

.g-icon {
  width: 19px;
  height: 19px;
  display: block;
}

#gBtn span {
  font-size: 16px;
  color: var(--gtext);
  letter-spacing: -0.01em;
}

#bottom {
  text-align: center;
  font-size: 15px;
  color: var(--bottom);
  margin: 0;
}

#bottom a {
  color: var(--bottom);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 2px;
}

/* 4) Mobile & Tablet Responsive (< 900px) */
@media (max-width: 899px) {
  .login-stage {
    overflow-y: auto;
    overflow-x: hidden;
  }

  .back-btn {
    top: 16px;
    top: max(16px, env(safe-area-inset-top, 0px));
    left: 16px;
    padding: 8px 14px 8px 10px;
    font-size: 13px;
    gap: 6px;
  }

  .back-icon {
    width: 14px;
    height: 14px;
  }

  .login-container {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 0 16px max(32px, env(safe-area-inset-bottom, 0px)) 16px;
    box-sizing: border-box;
  }

  /* Headline is placed safely below Back button */
  .hero {
    margin-top: 76px;
    margin-top: max(76px, calc(env(safe-area-inset-top, 0px) + 52px));
    margin-bottom: 20px;
    width: 100%;
    max-width: 440px;
    padding: 0 4px;
    box-sizing: border-box;
    text-align: left;
    pointer-events: none;
  }

  .hl-wrap {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .hl {
    display: block;
    color: #ffffff;
    font-size: clamp(26px, 7.5vw, 34px);
    letter-spacing: -0.03em;
    line-height: 1.12;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.85);
    white-space: normal;
    word-break: break-word;
  }

  .pane {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .login-card {
    width: 100%;
    max-width: 440px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.75);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.40);
    padding: 30px 22px 24px 22px;
    box-sizing: border-box;
  }

  .card-h1 {
    font-size: 28px;
    margin-bottom: 4px;
  }

  .card-sub {
    font-size: 14.5px;
    margin-bottom: 18px;
  }

  .field {
    height: 52px;
    margin-bottom: 12px;
  }

  #pw {
    margin-bottom: 18px;
  }

  #loginBtn {
    height: 52px;
    margin-bottom: 16px;
  }

  .login-divider {
    margin-bottom: 16px;
  }

  #gBtn {
    height: 52px;
    margin-bottom: 20px;
  }

  #bottom {
    font-size: 14px;
  }
}

@media (max-width: 360px) {
  .login-card {
    padding: 24px 16px 20px 16px;
  }
  .hl {
    font-size: 24px;
  }
  .card-h1 {
    font-size: 25px;
  }
}

  </style>
</head>
<body>
  <div class="login-stage" id="stage">
    <!-- 1) Fixed Full-screen Video Background -->
    <div class="photo" aria-hidden="true">
      <video class="photo-img" autoplay muted loop playsinline preload="auto">
        <source src="/falcon.mp4" type="video/mp4">
      </video>
      <div class="scrim"></div>
    </div>

    <!-- 2) Back Button -->
    <a href="/" class="back-btn" aria-label="Back to home">
      <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back</span>
    </a>

    <!-- 3) Main Responsive Container -->
    <div class="login-container">
      <div class="hero" id="hero">
        <div class="hl-wrap">
          <span class="hl" id="hl1">Find Signal to Action</span>
          <span class="hl" id="hl2">Instantly</span>
        </div>
      </div>

      <div class="pane" id="pane">
        <div class="login-card" id="card">
          <div class="card-in" id="cardIn">
            <h1 class="card-h1" id="h1">Welcome Back!</h1>
            <p class="card-sub" id="sub"><b>Log in</b> to continue monitoring your signals.</p>

            <div className="field" id="email" style="display:flex;align-items:center;height:56px;border-radius:12px;margin-bottom:14px;background:#fafafa;border:1.5px solid #acacae;padding:0 18px;">
              <input type="email" autocomplete="email" aria-label="Email address" placeholder="Eg. johndoe@gmail.com" style="width:100%;height:100%;border:none;background:transparent;outline:none;font-size:16px;">
            </div>

            <div className="field" id="pw" style="display:flex;align-items:center;height:56px;border-radius:12px;margin-bottom:22px;background:#f9f9f9;border:1.5px solid #acacae;padding:0 18px;">
              <input type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" style="width:100%;height:100%;border:none;background:transparent;outline:none;font-size:16px;">
            </div>

            <button type="button" id="loginBtn">
              <span>Login</span>
              <svg class="login-arrow" viewBox="0 0 22 22" aria-hidden="true">
                <path d="M3 11h15.4M11 3.3l7.7 7.7-7.7 7.7" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg>
            </button>

            <div class="login-divider">
              <i></i><b>OR</b><i></i>
            </div>

            <button type="button" id="gBtn">
              <svg class="g-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
                <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
                <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
                <path fill="#EA4335" d="M24 9.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 3.18 29.93 1 24 1 15.4 1 7.96 5.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
              </svg>
              <span>Sign in with Google</span>
            </button>

            <p id="bottom">Don&#8217;t have an account? <a href="/">Start Free</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
